<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="View Vincent Pronel's AI/ML, full-stack software engineering, and data analysis résumés."
    />
    <title>Vincent Pronel | Résumés</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M17 17h30v30H17z' fill='none' stroke='%2338bdf8' stroke-width='4'/%3E%3Cpath d='m23 25 9 18 9-18' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#0b1220',
              signal: '#38bdf8',
            },
          },
        },
      };
    </script>
    <style>
      html, body { height: 100%; }
      body { margin: 0; overflow: hidden; }
      .safe-top { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      .resume-frame { height: calc(100dvh - 9.55rem - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
      .resume-panel { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; pointer-events: none; }
      .resume-panel.is-active { visibility: visible; pointer-events: auto; }
      .fullscreen-close { top: calc(0.75rem + env(safe-area-inset-top)); right: calc(0.75rem + env(safe-area-inset-right)); }
      #fullscreenViewer { width: 100vw; height: 100dvh; overflow: hidden; background: white; }
      #fullscreenFrameHost { touch-action: pan-x pan-y pinch-zoom; -webkit-overflow-scrolling: touch; }
      .fullscreen-preview { display: block; width: 100%; height: 100%; object-fit: contain; background: white; user-select: none; -webkit-user-drag: none; touch-action: pan-x pan-y pinch-zoom; }
      @media (min-width: 640px) {
        .resume-frame { height: calc(100dvh - 8rem); }
      }
    </style>
  </head>
  <body class="bg-slate-200 text-slate-900 antialiased">
    <main class="flex h-full min-h-0 flex-col">
      <header class="safe-top shrink-0 bg-ink text-white shadow-lg shadow-slate-900/20">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 pb-3 pt-3 sm:px-6">
          <div class="min-w-0">
            <h1 class="truncate text-lg font-semibold tracking-tight sm:text-xl">Vincent Pronel</h1>
            <p id="resumeLabel" class="truncate text-sm text-slate-300">AI/ML Résumé</p>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <div class="h-8 w-px shrink-0 bg-slate-600" aria-hidden="true"></div>
            <img
              src="assets/kean-logo.svg"
              alt="Kean University"
              class="h-7 w-auto shrink-0 sm:h-8"
            />
            <button
              id="shareButton"
              type="button"
              class="inline-flex h-11 w-8 items-center justify-center text-white transition hover:text-signal focus:outline-none focus:ring-2 focus:ring-white disabled:cursor-wait disabled:opacity-60"
              aria-label="Share or save selected résumé"
              title="Share or save résumé"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12" />
                <path d="m7 10 5 5 5-5" />
                <path d="M5 21h14a2 2 0 0 0 2-2v-3" />
                <path d="M3 16v3a2 2 0 0 0 2 2" />
              </svg>
            </button>
          </div>
        </div>

        <nav class="mx-auto max-w-6xl px-2 sm:px-6" aria-label="Résumé versions">
          <div
            id="resumeTabs"
            class="grid grid-cols-3 gap-1 rounded-t-xl bg-slate-800/80 p-1"
            role="tablist"
            aria-label="Choose a résumé"
          >
            <button
              type="button"
              role="tab"
              id="tab-ai"
              aria-selected="true"
              aria-controls="resumeViewer"
              data-resume="ai"
              class="min-h-11 rounded-lg bg-white px-2 py-2 text-sm font-semibold text-ink shadow-sm focus:outline-none focus:ring-2 focus:ring-inset focus:ring-signal sm:text-base"
            >AI/ML</button>
            <button
              type="button"
              role="tab"
              id="tab-swe"
              aria-selected="false"
              aria-controls="resumeViewer"
              data-resume="swe"
              class="min-h-11 rounded-lg px-2 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-signal sm:text-base"
            >FullStack SWE</button>
            <button
              type="button"
              role="tab"
              id="tab-data"
              aria-selected="false"
              aria-controls="resumeViewer"
              data-resume="data"
              class="min-h-11 rounded-lg px-2 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-signal sm:text-base"
            >Data Analysis</button>
          </div>
        </nav>
      </header>

      <section class="safe-bottom min-h-0 flex-1 p-2 sm:p-4" aria-live="polite">
        <div id="resumeViewer" class="resume-frame relative mx-auto max-w-6xl overflow-hidden rounded-xl border border-slate-300 bg-white shadow-xl shadow-slate-900/10">
          <button
            id="fullscreenButton"
            type="button"
            class="absolute right-3 top-3 z-20 inline-flex h-11 w-11 items-center justify-center text-slate-950 transition hover:text-sky-700 focus:outline-none focus:ring-2 focus:ring-signal"
            aria-label="View selected résumé full screen"
            title="Full screen"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H3v5" />
              <path d="m3 3 6 6" />
              <path d="M16 3h5v5" />
              <path d="m21 3-6 6" />
              <path d="M8 21H3v-5" />
              <path d="m3 21 6-6" />
              <path d="M16 21h5v-5" />
              <path d="m21 21-6-6" />
            </svg>
          </button>
          <object
            class="resume-panel is-active bg-white"
            data-resume-panel="ai"
            data="resumes/vincent-pronel-ai-ml.pdf#view=FitH&amp;toolbar=1&amp;navpanes=0"
            type="application/pdf"
            role="tabpanel"
            aria-labelledby="tab-ai"
            title="Vincent Pronel AI/ML résumé"
          >
            <div class="flex h-full flex-col items-center justify-center gap-4 p-6 text-center">
              <p class="max-w-md text-base text-slate-700">Your browser cannot display this PDF inline.</p>
              <a
                href="resumes/vincent-pronel-ai-ml.pdf"
                target="_blank"
                rel="noopener"
                class="rounded-lg bg-ink px-5 py-3 font-semibold text-white"
              >Open the résumé</a>
            </div>
          </object>
          <object
            class="resume-panel bg-white"
            data-resume-panel="swe"
            data="resumes/vincent-pronel-fullstack-swe.pdf#view=FitH&amp;toolbar=1&amp;navpanes=0"
            type="application/pdf"
            role="tabpanel"
            aria-labelledby="tab-swe"
            aria-hidden="true"
            title="Vincent Pronel full-stack software engineering résumé"
          >
            <div class="flex h-full flex-col items-center justify-center gap-4 p-6 text-center">
              <p class="max-w-md text-base text-slate-700">Your browser cannot display this PDF inline.</p>
              <a
                href="resumes/vincent-pronel-fullstack-swe.pdf"
                target="_blank"
                rel="noopener"
                class="rounded-lg bg-ink px-5 py-3 font-semibold text-white"
              >Open the résumé</a>
            </div>
          </object>
          <object
            class="resume-panel bg-white"
            data-resume-panel="data"
            data="resumes/vincent-pronel-data-analysis.pdf#view=FitH&amp;toolbar=1&amp;navpanes=0"
            type="application/pdf"
            role="tabpanel"
            aria-labelledby="tab-data"
            aria-hidden="true"
            title="Vincent Pronel data analysis résumé"
          >
            <div class="flex h-full flex-col items-center justify-center gap-4 p-6 text-center">
              <p class="max-w-md text-base text-slate-700">Your browser cannot display this PDF inline.</p>
              <a
                href="resumes/vincent-pronel-data-analysis.pdf"
                target="_blank"
                rel="noopener"
                class="rounded-lg bg-ink px-5 py-3 font-semibold text-white"
              >Open the résumé</a>
            </div>
          </object>
        </div>
      </section>
    </main>

    <div
      id="fullscreenViewer"
      class="fixed inset-0 z-50 bg-black"
      role="dialog"
      aria-modal="true"
      aria-labelledby="fullscreenTitle"
      hidden
    >
      <h2 id="fullscreenTitle" class="sr-only">Full-screen résumé</h2>
      <div id="fullscreenFrameHost" class="relative h-full w-full overflow-auto"></div>
      <button
        id="closeFullscreenButton"
        type="button"
        class="fullscreen-close absolute z-20 inline-flex h-11 w-11 items-center justify-center text-black transition hover:text-sky-700 focus:outline-none focus:ring-2 focus:ring-signal"
        aria-label="Close full-screen résumé"
        title="Close"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M6 6l12 12" />
          <path d="M18 6 6 18" />
        </svg>
      </button>
    </div>

    <noscript>
      <div class="fixed inset-x-0 bottom-0 bg-amber-100 p-3 text-center text-sm text-amber-950">
        JavaScript is required for résumé sharing and full-screen viewing.
      </div>
    </noscript>

    <script>
      const resumes = {
        ai: {
          label: 'AI/ML Résumé',
          file: 'resumes/vincent-pronel-ai-ml.pdf',
          preview: 'resume-previews/vincent-pronel-ai-ml.png',
          downloadName: 'Vincent-Pronel-AI-ML-Resume.pdf',
          title: 'Vincent Pronel AI/ML résumé',
          tabId: 'tab-ai',
        },
        swe: {
          label: 'FullStack SWE Résumé',
          file: 'resumes/vincent-pronel-fullstack-swe.pdf',
          preview: 'resume-previews/vincent-pronel-fullstack-swe.png',
          downloadName: 'Vincent-Pronel-FullStack-SWE-Resume.pdf',
          title: 'Vincent Pronel full-stack software engineering résumé',
          tabId: 'tab-swe',
        },
        data: {
          label: 'Data Analysis Résumé',
          file: 'resumes/vincent-pronel-data-analysis.pdf',
          preview: 'resume-previews/vincent-pronel-data-analysis.png',
          downloadName: 'Vincent-Pronel-Data-Analysis-Resume.pdf',
          title: 'Vincent Pronel data analysis résumé',
          tabId: 'tab-data',
        },
      };

      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const viewerPanels = [...document.querySelectorAll('[data-resume-panel]')];
      const label = document.getElementById('resumeLabel');
      const shareButton = document.getElementById('shareButton');
      const fullscreenButton = document.getElementById('fullscreenButton');
      const fullscreenViewer = document.getElementById('fullscreenViewer');
      const fullscreenFrameHost = document.getElementById('fullscreenFrameHost');
      const closeFullscreenButton = document.getElementById('closeFullscreenButton');
      let currentResumeKey = 'ai';
      let fullscreenTrigger = null;
      let openedWithNativeFullscreen = false;

      function selectResume(key, updateHash = true) {
        const selected = resumes[key] || resumes.ai;
        currentResumeKey = resumes[key] ? key : 'ai';

        tabs.forEach((tab) => {
          const isActive = tab.dataset.resume === key;
          tab.setAttribute('aria-selected', String(isActive));
          tab.tabIndex = isActive ? 0 : -1;
          tab.className = isActive
            ? 'min-h-11 rounded-lg bg-white px-2 py-2 text-sm font-semibold text-ink shadow-sm focus:outline-none focus:ring-2 focus:ring-inset focus:ring-signal sm:text-base'
            : 'min-h-11 rounded-lg px-2 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-signal sm:text-base';
        });

        label.textContent = selected.label;
        viewerPanels.forEach((panel) => {
          const isActive = panel.dataset.resumePanel === currentResumeKey;
          panel.classList.toggle('is-active', isActive);
          panel.setAttribute('aria-hidden', String(!isActive));
        });

        if (updateHash) history.replaceState(null, '', `#${currentResumeKey}`);
      }

      function downloadResume(selected) {
        const link = document.createElement('a');
        link.href = selected.file;
        link.download = selected.downloadName;
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      async function shareResume() {
        const selected = resumes[currentResumeKey];
        shareButton.disabled = true;

        try {
          const response = await fetch(selected.file);
          if (!response.ok) throw new Error('Unable to load résumé');
          const resumeFile = new File([await response.blob()], selected.downloadName, { type: 'application/pdf' });

          if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [resumeFile] }))) {
            await navigator.share({
              title: selected.title,
              text: selected.title,
              files: [resumeFile],
            });
          } else if (navigator.share) {
            await navigator.share({
              title: selected.title,
              text: selected.title,
              url: new URL(selected.file, window.location.href).href,
            });
          } else {
            downloadResume(selected);
          }
        } catch (error) {
          if (error.name !== 'AbortError') downloadResume(selected);
        } finally {
          shareButton.disabled = false;
        }
      }

      function hideFullscreenViewer() {
        fullscreenViewer.hidden = true;
        fullscreenFrameHost.replaceChildren();
        openedWithNativeFullscreen = false;
        if (fullscreenTrigger) fullscreenTrigger.focus();
      }

      async function openFullscreenViewer() {
        const selected = resumes[currentResumeKey];
        const preview = document.createElement('img');
        preview.src = selected.preview;
        preview.alt = selected.title;
        preview.className = 'fullscreen-preview';
        preview.draggable = false;

        fullscreenTrigger = document.activeElement;
        fullscreenFrameHost.replaceChildren(preview);
        fullscreenFrameHost.scrollTo(0, 0);
        fullscreenViewer.hidden = false;
        closeFullscreenButton.focus();

        if (fullscreenViewer.requestFullscreen) {
          try {
            await fullscreenViewer.requestFullscreen();
            openedWithNativeFullscreen = true;
          } catch {
            openedWithNativeFullscreen = false;
          }
        }
      }

      async function closeFullscreenViewer() {
        const shouldExitNativeFullscreen = document.fullscreenElement === fullscreenViewer;
        hideFullscreenViewer();
        if (shouldExitNativeFullscreen && document.exitFullscreen) {
          try { await document.exitFullscreen(); } catch {}
        }
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => selectResume(tab.dataset.resume));
        tab.addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          let nextIndex = index;
          if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
          if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
          if (event.key === 'Home') nextIndex = 0;
          if (event.key === 'End') nextIndex = tabs.length - 1;
          tabs[nextIndex].focus();
          selectResume(tabs[nextIndex].dataset.resume);
        });
      });

      shareButton.addEventListener('click', shareResume);
      fullscreenButton.addEventListener('click', openFullscreenViewer);
      closeFullscreenButton.addEventListener('click', closeFullscreenViewer);

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !fullscreenViewer.hidden && !document.fullscreenElement) {
          closeFullscreenViewer();
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && openedWithNativeFullscreen && !fullscreenViewer.hidden) {
          hideFullscreenViewer();
        }
      });

      const initialKey = location.hash.slice(1);
      selectResume(resumes[initialKey] ? initialKey : 'ai', false);
    </script>
  </body>
</html>
